[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspot-demo"
version = "0.1.0"
description = "Local, evidence-aware finger-tapping demonstration"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.67,<2", "tzdata>=2025.1"]

[project.optional-dependencies]
camera = ["opencv-contrib-python>=4.11,<5", "mediapipe>=0.10.21,<0.11"]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "playwright>=1.51"]

[project.scripts]
blindspot = "blindspot.cli:main"

[tool.setuptools.package-data]
blindspot = ["data/*.json", "assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["blindspot"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.packages.find]
include = ["blindspot*"]
