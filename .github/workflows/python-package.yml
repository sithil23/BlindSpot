name: BLINDSPOT Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 — core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8,<10"

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py blindspot remote_sensor_api.py remote_sensor_simulator.py

      - name: Check dashboard imports and chart renderer
        run: |
          python -c "import blindspot.ui as ui; assert callable(ui.chart_document); print('Dashboard import OK')"

      - name: Run core regression tests
        run: |
          python -m pytest -q             tests/test_core.py             tests/test_remote_api.py             tests/test_multi_feed.py             tests/test_meals.py             tests/test_radiation.py
